events {
    worker_connections 1024;
}

http {
    server {
        listen 5443 ssl;
        server_name localhost oqs-wallet-inbound;

        ssl_certificate     /certs/wallet-inbound.crt;
        ssl_certificate_key /certs/wallet-inbound.key;

        ssl_client_certificate /certs/ca.crt;
        ssl_verify_client      optional;

        ssl_protocols TLSv1.3;
        ssl_conf_command Groups X25519MLKEM768:secp256r1:x25519;

        location / {
            proxy_pass http://wallet:5000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 5443;
            proxy_set_header ssl-client-cert $ssl_client_escaped_cert;
        }
    }
}
