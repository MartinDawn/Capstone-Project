events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_header_buffer_size 64k;
    large_client_header_buffers 4 64k;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    log_format mtls_debug '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent ssl_verify:"$ssl_client_verify" '
                          'client_dn:"$ssl_client_s_dn"';

    server {
        listen 8443 ssl;
        server_name localhost oqs-server-proxy;
        access_log /dev/stdout mtls_debug;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        ssl_client_certificate /certs/ca.crt;
        ssl_verify_client      optional;

        ssl_protocols TLSv1.3;
        ssl_conf_command Groups X25519MLKEM768:secp256r1:x25519;

        # L7 Routing
        # Resource Server endpoints
        location ~ ^/(api/(v1/)?(accounts|transfers|profile|meta)|open-banking) {
            set $upstream_resource "http://resource-server:4000";
            proxy_pass $upstream_resource;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header ssl-client-cert $ssl_client_escaped_cert;
        }

        # Bank Issuer endpoints
        location ~ ^/(token|introspect|credential|jwks|offer|\.well-known|hybrid-certs|api/policy|api/receive-offer|api/credentials|api/internal|api/v1/(challenge|verify-token)|api/test) {
            set $upstream_bank "http://bank-issuer:7000";
            proxy_pass $upstream_bank;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header ssl-client-cert $ssl_client_escaped_cert;
        }

        # Default: Keycloak
        location / {
            set $upstream_kc "http://keycloak:8080";
            proxy_pass $upstream_kc;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-Client-Cert $ssl_client_escaped_cert;
            proxy_set_header ssl-client-cert $ssl_client_escaped_cert;
        }
    }

    # User ingress (classical TLS, :9443). The machine ingress above (:8443) presents a hybrid
    # p384_mldsa65 certificate that browsers and standard TLS clients cannot validate, so users
    # and the load client reach the Bank here, exactly like the TPP (:4443) and wallet (:3443).
    server {
        listen 9443 ssl;
        server_name localhost;
        access_log /dev/stdout mtls_debug;

        ssl_certificate     /certs/browser.crt;
        ssl_certificate_key /certs/browser.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # L7 Routing
        # Resource Server endpoints
        location ~ ^/(api/(v1/)?(accounts|transfers|profile|meta)|open-banking) {
            set $upstream_resource "http://resource-server:4000";
            proxy_pass $upstream_resource;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 9443;
            proxy_set_header ssl-client-cert $ssl_client_escaped_cert;
        }

        # Bank Issuer endpoints
        location ~ ^/(token|introspect|credential|jwks|offer|\.well-known|hybrid-certs|api/policy|api/receive-offer|api/credentials|api/internal|api/v1/(challenge|verify-token)|api/test) {
            set $upstream_bank "http://bank-issuer:7000";
            proxy_pass $upstream_bank;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 9443;
            proxy_set_header ssl-client-cert $ssl_client_escaped_cert;
        }

        # Default: Keycloak
        location / {
            set $upstream_kc "http://keycloak:8080";
            proxy_pass $upstream_kc;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 9443;
            proxy_set_header X-Forwarded-Client-Cert $ssl_client_escaped_cert;
            proxy_set_header ssl-client-cert $ssl_client_escaped_cert;
        }
    }

}
