events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s ipv6=off;

    log_format mtls_debug '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent ssl_verify:"$ssl_client_verify" '
                          'client_dn:"$ssl_client_s_dn"';

    server {
        listen 8443 ssl;
        server_name localhost oqs-server-proxy;
        access_log /dev/stdout mtls_debug;

        ssl_certificate     /certs/server.crt;
        ssl_certificate_key /certs/server.key;

        ssl_client_certificate /certs/ca.crt;
        ssl_verify_client      optional;

        ssl_protocols TLSv1.3;
        ssl_conf_command Groups X25519MLKEM768:secp256r1:x25519;

        # L7 Routing
        # Resource Server endpoints
        location ~ ^/(api/(accounts|transfers|profile)|open-banking) {
            set $upstream_resource "http://resource-server:4000";
            proxy_pass $upstream_resource;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header ssl-client-cert $ssl_client_escaped_cert;
        }

        # Bank Issuer endpoints
        location ~ ^/(token|introspect|credential|jwks|offer|\.well-known|api/receive-offer|api/credentials) {
            set $upstream_bank "http://bank-issuer:7000";
            proxy_pass $upstream_bank;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header ssl-client-cert $ssl_client_escaped_cert;
        }

        # Default: Keycloak
        location / {
            set $upstream_kc "http://keycloak:8080";
            proxy_pass $upstream_kc;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-Client-Cert $ssl_client_escaped_cert;
            proxy_set_header ssl-client-cert $ssl_client_escaped_cert;
        }
    }
}
