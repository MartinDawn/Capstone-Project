events {
    worker_connections 1024;
}

http {
    client_header_buffer_size 64k;
    large_client_header_buffers 4 64k;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # ── 1. Browser UI Ingress (:4443) ────────────────────────────────
    server {
        listen 4443 ssl;
        server_name localhost;

        ssl_certificate     /certs/tpp.crt;
        ssl_certificate_key /certs/tpp.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass https://tpp-fapi:3000;
            proxy_ssl_verify off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Host $http_host;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }

    # ── 2. API Ingress (:6443) ───────────────────────────────────────
    # Standard TLS 1.2/1.3 for Machine-to-Machine API calls
    server {
        listen 6443 ssl;
        server_name tls-tpp-fapi-ingress;

        ssl_certificate     /certs/tpp.crt;
        ssl_certificate_key /certs/tpp.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass https://tpp-fapi:3000;
            proxy_ssl_verify off;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Host $http_host;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }
    }
}
