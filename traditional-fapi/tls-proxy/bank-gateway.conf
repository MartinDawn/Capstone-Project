events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_header_buffer_size 64k;
    large_client_header_buffers 4 64k;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    log_format mtls_debug '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent ssl_verify:"$ssl_client_verify" '
                          'client_dn:"$ssl_client_s_dn"';

    # ── Unified Bank Gateway (:8443) ──────────────────────────────────
    # Handles mTLS at proxy layer, routes to Keycloak (HTTP) and
    # Resource Server (HTTPS internal) by L7 URL path.
    server {
        listen 8443 ssl;
        server_name localhost bank-gateway;
        access_log /dev/stdout mtls_debug;

        ssl_certificate     /certs/keycloak.crt;
        ssl_certificate_key /certs/keycloak.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # Accept client cert if presented; Keycloak enforces at app level
        ssl_client_certificate /certs/ca.crt;
        ssl_verify_client      optional;

        # ── Resource Server endpoints ────────────────────────────────
        location ~ ^/(api/(v1/)?(accounts|transfers|profile|meta)|open-banking) {
            set $upstream_rs "http://resource-server-fapi:4000";
            proxy_pass $upstream_rs;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header ssl-client-cert $ssl_client_escaped_cert;
        }

        # ── Default: Keycloak (HTTP internal) ───────────────────────
        location / {
            set $upstream_kc "http://keycloak-fapi:8080";
            proxy_pass $upstream_kc;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 8443;
            proxy_set_header X-Forwarded-Client-Cert $ssl_client_escaped_cert;
            proxy_set_header ssl-client-cert $ssl_client_escaped_cert;
        }
    }
}
